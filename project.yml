name: Uncoil
options:
  bundleIdPrefix: com.gkhntpbs
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: 1.5.1

settings:
  base:
    DEVELOPMENT_TEAM: K3TKWWVEB9
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic

targets:
  uncoil-hook:
    type: tool
    platform: macOS
    sources:
      - path: HookHelper
    settings:
      base:
        PRODUCT_NAME: uncoil-hook
        SKIP_INSTALL: true
      configs:
        Debug:
          # Xcode's automatic signing gives a command-line tool the
          # profile-bound `com.apple.application-identifier` entitlement. With
          # an Apple Development certificate and no embedded provisioning
          # profile, AMFI kills the helper the moment it execs (SIGKILL, exit
          # 137) — which reaches the agent as "Failed to reconnect to uncoil".
          # Debug helpers are ad-hoc signed instead; the Developer ID export
          # re-signs the whole bundle for release, so distribution is unchanged.
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "-"
          DEVELOPMENT_TEAM: ""
          PROVISIONING_PROFILE_SPECIFIER: ""

  uncoil-runtimed:
    type: tool
    platform: macOS
    sources:
      - path: RuntimeHelper
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: uncoil-runtimed
        SKIP_INSTALL: true
      configs:
        Debug:
          # Xcode's automatic signing gives a command-line tool the
          # profile-bound `com.apple.application-identifier` entitlement. With
          # an Apple Development certificate and no embedded provisioning
          # profile, AMFI kills the helper the moment it execs (SIGKILL, exit
          # 137) — which reaches the agent as "Failed to reconnect to uncoil".
          # Debug helpers are ad-hoc signed instead; the Developer ID export
          # re-signs the whole bundle for release, so distribution is unchanged.
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "-"
          DEVELOPMENT_TEAM: ""
          PROVISIONING_PROFILE_SPECIFIER: ""

  uncoil-mcp:
    type: tool
    platform: macOS
    sources:
      - path: McpHelper
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: uncoil-mcp
        SKIP_INSTALL: true
      configs:
        Debug:
          # Xcode's automatic signing gives a command-line tool the
          # profile-bound `com.apple.application-identifier` entitlement. With
          # an Apple Development certificate and no embedded provisioning
          # profile, AMFI kills the helper the moment it execs (SIGKILL, exit
          # 137) — which reaches the agent as "Failed to reconnect to uncoil".
          # Debug helpers are ad-hoc signed instead; the Developer ID export
          # re-signs the whole bundle for release, so distribution is unchanged.
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "-"
          DEVELOPMENT_TEAM: ""
          PROVISIONING_PROFILE_SPECIFIER: ""

  uncoil-extension:
    type: tool
    platform: macOS
    sources:
      - path: ExtensionHelper
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: uncoil-extension
        SKIP_INSTALL: true
      configs:
        Debug:
          # Xcode's automatic signing gives a command-line tool the
          # profile-bound `com.apple.application-identifier` entitlement. With
          # an Apple Development certificate and no embedded provisioning
          # profile, AMFI kills the helper the moment it execs (SIGKILL, exit
          # 137) — which reaches the agent as "Failed to reconnect to uncoil".
          # Debug helpers are ad-hoc signed instead; the Developer ID export
          # re-signs the whole bundle for release, so distribution is unchanged.
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "-"
          DEVELOPMENT_TEAM: ""
          PROVISIONING_PROFILE_SPECIFIER: ""

  Uncoil:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Shared
    dependencies:
      - package: SwiftTerm
      - target: uncoil-hook
        embed: false
      - target: uncoil-runtimed
        embed: false
      - target: uncoil-mcp
        embed: false
      - target: uncoil-extension
        embed: false
    postBuildScripts:
      # No outputFiles on purpose: with them, Xcode decides the phase is up to
      # date and a helper that was copied while mis-signed stays in the bundle
      # build after build. Copying four small binaries every time is cheaper
      # than an MCP server that silently dies at exec.
      - name: Embed and ad-hoc sign helpers
        script: |
          set -e
          HELPERS_DIR="$BUILT_PRODUCTS_DIR/$CONTENTS_FOLDER_PATH/Helpers"
          mkdir -p "$HELPERS_DIR"
          for helper in uncoil-hook uncoil-runtimed uncoil-mcp uncoil-extension; do
            cp "$BUILT_PRODUCTS_DIR/$helper" "$HELPERS_DIR/$helper"
            # A Debug helper signed with an Apple Development certificate carries
            # the profile-bound com.apple.application-identifier entitlement and
            # no provisioning profile, so AMFI SIGKILLs it at exec — the agent
            # reports that as "Failed to reconnect to uncoil: -32000". Ad-hoc is
            # what a local helper needs; the Developer ID export re-signs the
            # whole bundle for release, so distribution is untouched.
            if [ "$CONFIGURATION" = "Debug" ]; then
              codesign --force --sign - --timestamp=none "$HELPERS_DIR/$helper"
            fi
          done
        inputFiles:
          - $(BUILT_PRODUCTS_DIR)/uncoil-hook
          - $(BUILT_PRODUCTS_DIR)/uncoil-runtimed
          - $(BUILT_PRODUCTS_DIR)/uncoil-mcp
          - $(BUILT_PRODUCTS_DIR)/uncoil-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gkhntpbs.uncoil
        PRODUCT_NAME: Uncoil
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Gökhan Topbaş"
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        ENABLE_USER_SCRIPT_SANDBOXING: false
        SWIFT_STRICT_CONCURRENCY: minimal
      # Debug keeps the hardened runtime off so a locally built app can attach a
      # debugger and spawn helpers without an entitlement round-trip; Release
      # needs it on, because notarization refuses a build without it.
      configs:
        Debug:
          ENABLE_HARDENED_RUNTIME: false
        Release:
          ENABLE_HARDENED_RUNTIME: true

  UncoilTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: Uncoil
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gkhntpbs.uncoil.tests
        GENERATE_INFOPLIST_FILE: true

  UncoilUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: UITests
    dependencies:
      - target: Uncoil
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gkhntpbs.uncoil.uitests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: Uncoil

schemes:
  Uncoil:
    build:
      targets:
        Uncoil: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - UncoilTests

  UncoilUI:
    build:
      targets:
        Uncoil: all
    test:
      config: Debug
      targets:
        - UncoilUITests
