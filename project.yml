name: Uncoil
options:
  bundleIdPrefix: com.gkhntpbs
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: 1.5.1

settings:
  base:
    DEVELOPMENT_TEAM: K3TKWWVEB9
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic

targets:
  uncoil-hook:
    type: tool
    platform: macOS
    sources:
      - path: HookHelper
    settings:
      base:
        PRODUCT_NAME: uncoil-hook
        SKIP_INSTALL: true

  uncoil-runtimed:
    type: tool
    platform: macOS
    sources:
      - path: RuntimeHelper
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: uncoil-runtimed
        SKIP_INSTALL: true

  uncoil-mcp:
    type: tool
    platform: macOS
    sources:
      - path: McpHelper
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: uncoil-mcp
        SKIP_INSTALL: true

  uncoil-extension:
    type: tool
    platform: macOS
    sources:
      - path: ExtensionHelper
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: uncoil-extension
        SKIP_INSTALL: true

  Uncoil:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Shared
    dependencies:
      - package: SwiftTerm
      - target: uncoil-hook
        embed: false
      - target: uncoil-runtimed
        embed: false
      - target: uncoil-mcp
        embed: false
      - target: uncoil-extension
        embed: false
    postBuildScripts:
      - name: Embed uncoil-hook helper
        script: |
          HELPERS_DIR="$BUILT_PRODUCTS_DIR/$CONTENTS_FOLDER_PATH/Helpers"
          mkdir -p "$HELPERS_DIR"
          cp "$BUILT_PRODUCTS_DIR/uncoil-hook" "$HELPERS_DIR/uncoil-hook"
          cp "$BUILT_PRODUCTS_DIR/uncoil-runtimed" "$HELPERS_DIR/uncoil-runtimed"
          cp "$BUILT_PRODUCTS_DIR/uncoil-mcp" "$HELPERS_DIR/uncoil-mcp"
          cp "$BUILT_PRODUCTS_DIR/uncoil-extension" "$HELPERS_DIR/uncoil-extension"
        inputFiles:
          - $(BUILT_PRODUCTS_DIR)/uncoil-hook
          - $(BUILT_PRODUCTS_DIR)/uncoil-runtimed
          - $(BUILT_PRODUCTS_DIR)/uncoil-mcp
          - $(BUILT_PRODUCTS_DIR)/uncoil-extension
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/uncoil-hook
          - $(BUILT_PRODUCTS_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/uncoil-runtimed
          - $(BUILT_PRODUCTS_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/uncoil-mcp
          - $(BUILT_PRODUCTS_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/uncoil-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gkhntpbs.uncoil
        PRODUCT_NAME: Uncoil
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Gökhan Topbaş"
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        ENABLE_USER_SCRIPT_SANDBOXING: false
        SWIFT_STRICT_CONCURRENCY: minimal
      # Debug keeps the hardened runtime off so a locally built app can attach a
      # debugger and spawn helpers without an entitlement round-trip; Release
      # needs it on, because notarization refuses a build without it.
      configs:
        Debug:
          ENABLE_HARDENED_RUNTIME: false
        Release:
          ENABLE_HARDENED_RUNTIME: true

  UncoilTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: Uncoil
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gkhntpbs.uncoil.tests
        GENERATE_INFOPLIST_FILE: true

  UncoilUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: UITests
    dependencies:
      - target: Uncoil
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gkhntpbs.uncoil.uitests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: Uncoil

schemes:
  Uncoil:
    build:
      targets:
        Uncoil: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - UncoilTests

  UncoilUI:
    build:
      targets:
        Uncoil: all
    test:
      config: Debug
      targets:
        - UncoilUITests
