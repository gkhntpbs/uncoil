name: Uncoil
options:
  bundleIdPrefix: com.gkhntpbs
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: 1.5.1

settings:
  base:
    DEVELOPMENT_TEAM: K3TKWWVEB9
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic

targets:
  uncoil-hook:
    type: tool
    platform: macOS
    sources:
      - path: HookHelper
    settings:
      base:
        PRODUCT_NAME: uncoil-hook
        SKIP_INSTALL: true

  Uncoil:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: SwiftTerm
      - target: uncoil-hook
        embed: false
    postBuildScripts:
      - name: Embed uncoil-hook helper
        script: |
          cp "$BUILT_PRODUCTS_DIR/uncoil-hook" "$BUILT_PRODUCTS_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/uncoil-hook"
        inputFiles:
          - $(BUILT_PRODUCTS_DIR)/uncoil-hook
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/uncoil-hook
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gkhntpbs.uncoil
        PRODUCT_NAME: Uncoil
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Gökhan Topbaş"
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        ENABLE_HARDENED_RUNTIME: false
        ENABLE_USER_SCRIPT_SANDBOXING: false
        SWIFT_STRICT_CONCURRENCY: minimal

  UncoilTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: Uncoil
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gkhntpbs.uncoil.tests
        GENERATE_INFOPLIST_FILE: true

  UncoilUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: UITests
    dependencies:
      - target: Uncoil
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gkhntpbs.uncoil.uitests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: Uncoil

schemes:
  Uncoil:
    build:
      targets:
        Uncoil: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - UncoilTests

  UncoilUI:
    build:
      targets:
        Uncoil: all
    test:
      config: Debug
      targets:
        - UncoilUITests
